name: Runtime check

on:
  pull_request:
    paths: ['kb/**', 'runtime/**', 'knowledge/**', 'skills/**', 'commands/**', 'agents/**', 'portable.json', 'packages/vscode/**']
  push:
    branches: [master]
    paths: ['kb/**', 'runtime/**', 'knowledge/**', 'skills/**', 'commands/**', 'agents/**', 'portable.json', 'packages/vscode/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:runtime
      - name: runtime/ must match the committed bundles
        run: git diff --exit-code -- ../runtime/
      - name: Portability lint (skills, commands, agents)
        run: node ../runtime/kb-cli.mjs lint --root ..
      - run: npm test

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --workspace=packages/vscode
      - run: npm run check:registry --workspace=packages/vscode
      - run: npm test --workspace=packages/vscode
      - run: npx tsc --noEmit -p packages/vscode
